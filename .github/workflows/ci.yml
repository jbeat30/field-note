name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 PR에 새로 푸시하면 이전 실행을 취소
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR 방향 검사 (docs/02-git-workflow.md)
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치 규칙 검사
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          semver='[0-9]+\.[0-9]+\.[0-9]+'
          if [[ "$BASE" == "main" ]]; then
            pattern="^release/${semver}$"
          elif [[ "$BASE" =~ ^release/${semver}$ ]]; then
            # 같은 버전의 피쳐 브랜치 또는 수정 브랜치
            pattern="^(feature/${BASE#release/}|fix-.+)$"
          elif [[ "$BASE" =~ ^feature/${semver}$ ]]; then
            pattern="^(feat|fix|docs|chore|refactor|perf|test|ci)-.+"
          else
            echo "허용되지 않는 대상 브랜치: $BASE"
            exit 1
          fi
          if [[ ! "$HEAD" =~ $pattern ]]; then
            echo "$HEAD → $BASE PR은 허용되지 않음 (필요 형식: $pattern)"
            exit 1
          fi
          echo "$HEAD → $BASE 허용"

  # 검사 범위 결정
  #   full    feature → release, release → main, main 푸시: 전체 검사
  #   light   기능 브랜치 → feature: 정적 검사와 단위·통합 시험 (문서만 바꾸면 서식만)
  #   version 버전 올림 브랜치(fix-release-version-*) → release: package.json·문서 변경만 허용
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=full
          docs_only=false
          if [[ "$EVENT" == "pull_request" ]]; then
            if [[ "$HEAD" =~ ^fix-release-version- && "$BASE" =~ ^release/ ]]; then
              mode=version
            elif [[ "$BASE" =~ ^feature/ ]]; then
              mode=light
              files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
              if [[ -n "$files" ]] && ! grep -qvE '^(docs/|[^/]+\.md$)' <<<"$files"; then
                docs_only=true
              fi
            fi
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >>"$GITHUB_OUTPUT"
          echo "검사 범위: $mode (문서만 변경: $docs_only)"

  # 아래 잡들은 병렬로 실행하고, 필수 체크 이름인 `verify`는 마지막 잡이 결과를 모아 판정한다
  static:
    needs: scope
    if: needs.scope.outputs.mode != 'version'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: needs.scope.outputs.docs_only != 'true'
        run: pnpm typecheck
      - if: needs.scope.outputs.docs_only != 'true'
        run: pnpm lint
      - if: needs.scope.outputs.docs_only != 'true'
        run: pnpm check:comments --all
      - run: pnpm format:check
      - if: needs.scope.outputs.mode == 'full'
        run: pnpm build
      - if: needs.scope.outputs.mode == 'full'
        run: pnpm audit --prod

  test:
    needs: scope
    if: needs.scope.outputs.mode == 'full' || (needs.scope.outputs.mode == 'light' && needs.scope.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  stories:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @field-note/web exec playwright install --with-deps chromium
      - run: pnpm test:stories

  # 화면 전체 흐름(Playwright): 실제 DB·객체 저장소·API·웹을 띄워 핵심 흐름과 하루 일지 입력 시간을 확인
  e2e:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @field-note/web exec playwright install --with-deps chromium
      - run: pnpm env:init
      # Prisma 클라이언트는 저장소에 없는 생성물이라 DB 준비·API 실행 전에 만들어야 함
      - run: pnpm --filter @field-note/api db:generate
      - run: pnpm infra:up
      - run: pnpm db:setup
      - run: pnpm db:seed
      - run: pnpm e2e
      - name: 실패 시 보고서·추적 파일 보관
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # 서버·마이그레이션·점검 작업·웹 이미지가 빌드되는지 확인 (배포는 하지 않음)
  image:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 서버 이미지 빌드
        run: docker build -f apps/api/Dockerfile -t field-note-api .
      - name: 마이그레이션 이미지 빌드
        run: docker build -f apps/api/Dockerfile --target migrate -t field-note-migrate .
      - name: 점검 작업 이미지 빌드
        run: docker build -f apps/api/Dockerfile --target ops -t field-note-ops .
      - name: 웹 이미지 빌드
        run: docker build -f deploy/web.Dockerfile -t field-note-web .
      - name: 서버 구성 파일 검사
        run: |
          cp deploy/env.example deploy/.env
          cp deploy/ops.env.example deploy/ops.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config --quiet

  # 버전 올림 PR: package.json과 문서만 바뀌었는지 확인 (코드가 섞이면 전체 검사 대상인 일반 PR로 보내야 함)
  version-check:
    needs: scope
    if: needs.scope.outputs.mode == 'version'
    runs-on: ubuntu-latest
    steps:
      - name: 변경 파일 범위 검사
        env:
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          echo "$files"
          bad="$(grep -vE '(^|/)package\.json$|^docs/|^[^/]+\.md$' <<<"$files" || true)"
          if [[ -n "$bad" ]]; then
            echo "버전 올림 PR에 허용되지 않는 파일이 있음:"
            echo "$bad"
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  verify:
    needs: [scope, static, test, stories, e2e, image, version-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 검사 결과 판정
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "결과: $RESULTS"
          # 범위에 해당하지 않아 건너뛴 잡(skipped)은 통과로 보고, 실패·취소가 하나라도 있으면 실패
          for r in $RESULTS; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "실패한 검사가 있음"
              exit 1
            fi
          done
