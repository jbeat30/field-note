name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # PR 방향 검사 (docs/02-git-workflow.md)
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치 규칙 검사
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          semver='[0-9]+\.[0-9]+\.[0-9]+'
          if [[ "$BASE" == "main" ]]; then
            pattern="^release/${semver}$"
          elif [[ "$BASE" =~ ^release/${semver}$ ]]; then
            # 같은 버전의 피쳐 브랜치 또는 수정 브랜치
            pattern="^(feature/${BASE#release/}|fix-.+)$"
          elif [[ "$BASE" =~ ^feature/${semver}$ ]]; then
            pattern="^(feat|fix|docs|chore|refactor|test)-.+"
          else
            echo "허용되지 않는 대상 브랜치: $BASE"
            exit 1
          fi
          if [[ ! "$HEAD" =~ $pattern ]]; then
            echo "$HEAD → $BASE PR은 허용되지 않음 (필요 형식: $pattern)"
            exit 1
          fi
          echo "$HEAD → $BASE 허용"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --filter @field-note/web exec playwright install --with-deps chromium
      - run: pnpm test:stories
      - run: pnpm build
      - run: pnpm audit --prod
