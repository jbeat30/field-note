name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # PR 방향 검사 (docs/02-git-workflow.md)
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치 규칙 검사
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          semver='[0-9]+\.[0-9]+\.[0-9]+'
          if [[ "$BASE" == "main" ]]; then
            pattern="^release/${semver}$"
          elif [[ "$BASE" =~ ^release/${semver}$ ]]; then
            # 같은 버전의 피쳐 브랜치 또는 수정 브랜치
            pattern="^(feature/${BASE#release/}|fix-.+)$"
          elif [[ "$BASE" =~ ^feature/${semver}$ ]]; then
            pattern="^(feat|fix|docs|chore|refactor|test)-.+"
          else
            echo "허용되지 않는 대상 브랜치: $BASE"
            exit 1
          fi
          if [[ ! "$HEAD" =~ $pattern ]]; then
            echo "$HEAD → $BASE PR은 허용되지 않음 (필요 형식: $pattern)"
            exit 1
          fi
          echo "$HEAD → $BASE 허용"

  # 아래 세 잡은 병렬로 실행하고, 필수 체크 이름인 `verify`는 마지막 잡이 결과를 모아 판정한다
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm audit --prod

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @field-note/web exec playwright install --with-deps chromium
      - run: pnpm test:stories

  # 화면 전체 흐름(Playwright): 실제 DB·객체 저장소·API·웹을 띄워 핵심 흐름과 하루 일지 입력 시간을 확인
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @field-note/web exec playwright install --with-deps chromium
      - run: pnpm env:init
      - run: pnpm infra:up
      - run: pnpm db:setup
      - run: pnpm db:seed
      - run: pnpm e2e
      - name: 실패 시 보고서·추적 파일 보관
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  verify:
    needs: [static, test, stories, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 검사 결과 판정
        run: |
          echo "static=${{ needs.static.result }} test=${{ needs.test.result }} stories=${{ needs.stories.result }} e2e=${{ needs.e2e.result }}"
          if [[ "${{ needs.static.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.stories.result }}" != "success" || "${{ needs.e2e.result }}" != "success" ]]; then
            echo "실패한 검사가 있음"
            exit 1
          fi
