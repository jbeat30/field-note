# 로컬 개발 인프라 (PostgreSQL, S3 호환 저장소, 가짜 메일 수신기)
name: field-note

services:
  postgres:
    image: postgres:18
    environment:
      # .env 값을 쓰고, 없으면 기존 로컬 값으로 동작 (기존 DB 볼륨 호환)
      POSTGRES_USER: ${POSTGRES_USER:-field_note}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-field_note}
      POSTGRES_DB: ${POSTGRES_DB:-field_note}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO 공식 이미지는 더 이상 배포되지 않아 MinIO 호환 S3 저장소인 RustFS 사용
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-field_note}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-field_note_secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  rustfs-data:
