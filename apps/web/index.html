<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>필드노트</title>
    <meta name="theme-color" content="#005ce6" />
    <!-- 재설정·초대·해지 취소 링크의 토큰이 외부 사이트로 넘어가는 Referer에 실리지 않게 함 -->
    <meta name="referrer" content="no-referrer" />
    <script>
      // 첫 화면이 깜빡이지 않게 저장된 테마(없으면 기기 설정)를 먼저 적용
      try {
        var mode = localStorage.getItem('field-note-theme');
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
