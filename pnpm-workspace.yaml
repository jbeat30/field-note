packages:
  - apps/*
  - packages/*

# 설치 스크립트 실행 허용 목록 (네이티브 바이너리 확인용만 허용)
allowBuilds:
  '@swc/core': true
  esbuild: true
  '@parcel/watcher': false
  unrs-resolver: false
  '@prisma/engines': true
  prisma: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  '@scarf/scarf': false
  argon2: true

# 보안 경고가 있는 하위 의존성을 패치 버전으로 고정 (pnpm audit --prod 통과용)
# exceljs 4.4.0이 uuid 8을 쓰는데 v3/v5/v6의 버퍼 범위 검사 누락 경고(GHSA-w5hq-g745-h8pq)가 있어 11.1.1로 올림. exceljs는 v4만 쓰므로 호환
overrides:
  # qs의 문자열 변환 중 예외로 인한 서비스 거부 취약점 패치 버전 고정
  'qs@>=6.7.0 <=6.16.0': 6.16.1
  'ip-address@<=10.7.3': 10.7.4
  'uuid@<11.1.1': 11.1.1
  # ajv가 끌어오는 fast-uri와 express가 끌어오는 body-parser의 보안 경고(GHSA-xhq7-xmqj-769h 등) 패치 버전으로 고정
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  # eslint 플러그인이 끌어오는 zod도 패치 버전으로 고정
  'zod@<4.6.6': 4.6.7
  # prisma CLI·concurrently가 끌어오는 개발 도구 하위 의존성 (실행 서버에는 들어가지 않음)
  'shell-quote@>=1.8.4 <1.11.0': 1.12.0
  'mysql2@<3.23.1': 3.24.6
  'deepmerge-ts@<8.0.0': 8.0.2
